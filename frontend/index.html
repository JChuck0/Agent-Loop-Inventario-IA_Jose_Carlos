<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventory // AI Terminal</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body
    class="
        bg-black
        text-green-400
        font-mono
        overflow-hidden
    "
>

    <main class="h-screen flex flex-col bg-black">

        <!-- ========================================
             HEADER
        ========================================= -->

        <header
            class="
                flex
                items-center
                justify-between
                gap-4

                px-4
                sm:px-6
                md:px-8
                py-4

                border-b
                border-green-500/60

                bg-black
            "
        >

            <h1
                class="
                    text-sm
                    sm:text-base
                    md:text-lg

                    font-bold
                    tracking-[0.18em]

                    text-green-400

                    drop-shadow-[0_0_6px_rgba(74,222,128,0.65)]
                "
            >
                INVENTORY // AI TERMINAL
            </h1>


            <div
                class="
                    flex
                    items-center
                    gap-2

                    text-xs
                    sm:text-sm

                    text-green-400
                    whitespace-nowrap
                "
            >

                <span
                    class="
                        w-2
                        h-2

                        rounded-full

                        bg-green-400

                        shadow-[0_0_8px_rgba(74,222,128,0.9)]
                    "
                ></span>

                <span class="hidden sm:inline">
                    SYSTEM ONLINE
                </span>

                <span class="sm:hidden">
                    ONLINE
                </span>

            </div>

        </header>


        <!-- ========================================
             CONVERSATION AREA
        ========================================= -->

        <section
            id="conversation"
            aria-label="Conversación con el agente"
            aria-live="polite"

            class="
                flex-1
                overflow-y-auto

                px-4
                sm:px-6
                md:px-10

                py-6

                scroll-smooth

                [&::-webkit-scrollbar]:w-1.5
                [&::-webkit-scrollbar-track]:bg-black
                [&::-webkit-scrollbar-thumb]:bg-green-500/40
                [&::-webkit-scrollbar-thumb]:rounded-none
                hover:[&::-webkit-scrollbar-thumb]:bg-green-400/70
            "
        >

            <div
                id="messages"

                class="
                    max-w-5xl
                    mx-auto

                    flex
                    flex-col
                    gap-5
                "
            >

                <!-- ========================================
                     SYSTEM INITIALIZATION
                ========================================= -->

                <div
                    class="
                        mb-4

                        text-xs
                        sm:text-sm

                        leading-6

                        text-green-500/60
                    "
                >

                    <p>
                        &gt; SYSTEM INITIALIZED
                    </p>

                    <p>
                        &gt; INVENTORY AGENT ONLINE
                    </p>

                    <p>
                        &gt; WAITING FOR INPUT
                        <span class="animate-pulse">█</span>
                    </p>

                </div>

            </div>

        </section>


        <!-- ========================================
             COMMAND INPUT
        ========================================= -->

        <footer
            class="
                border-t
                border-green-500/60

                bg-black

                px-4
                sm:px-6

                py-4
            "
        >

            <form
                id="message-form"

                class="
                    max-w-5xl
                    mx-auto

                    flex
                    items-end

                    gap-3
                "
            >

                <label
                    for="message-input"
                    class="sr-only"
                >
                    Escribe una instrucción para el agente
                </label>


                <!-- INPUT CONTAINER -->

                <div
                    class="
                        group

                        flex-1
                        flex
                        items-start

                        bg-black

                        border
                        border-green-500/60

                        transition-all
                        duration-200

                        focus-within:border-green-400

                        focus-within:shadow-[0_0_10px_rgba(74,222,128,0.18)]
                    "
                >

                    <span
                        aria-hidden="true"

                        class="
                            pl-4
                            pt-3

                            text-green-400

                            select-none

                            drop-shadow-[0_0_4px_rgba(74,222,128,0.6)]
                        "
                    >
                        &gt;
                    </span>


                    <textarea
                        id="message-input"

                        rows="1"

                        maxlength="1000"

                        autocomplete="off"

                        placeholder="Enter command..."

                        class="
                            flex-1

                            min-h-[48px]
                            max-h-32

                            resize-none

                            bg-transparent

                            px-3
                            py-3

                            text-sm
                            sm:text-base

                            text-green-300

                            placeholder:text-green-900

                            caret-green-400

                            outline-none
                        "
                    ></textarea>

                </div>


                <!-- SEND BUTTON -->

                <button
                    id="send-button"

                    type="submit"

                    class="
                        min-h-[48px]

                        px-5

                        border
                        border-green-400

                        bg-black

                        text-sm
                        font-bold

                        tracking-[0.15em]

                        text-green-300

                        transition-all
                        duration-150

                        hover:bg-green-400
                        hover:text-black

                        hover:shadow-[0_0_14px_rgba(74,222,128,0.45)]

                        focus:outline-none
                        focus:ring-1
                        focus:ring-green-400

                        disabled:opacity-30
                        disabled:cursor-not-allowed
                        disabled:hover:bg-black
                        disabled:hover:text-green-300
                        disabled:hover:shadow-none
                    "
                >
                    SEND
                </button>

            </form>

        </footer>

    </main>


    <script src="./app.js"></script>

</body>

</html>
